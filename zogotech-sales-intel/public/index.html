<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZogoTech Sales Intel</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#123B63;--sky:#3E9BD6;--orange:#F2872E;--orange-deep:#D66A16;
    --paper:#FBFCFE;--ink:#0F2438;--ink-2:#4A6076;--ink-3:#8AA0B4;--rule:#DCE7F1;
    --rule-2:#EDF3F9;--good:#2E7D6B;--card:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    font-size:14px;line-height:1.55;padding:40px 22px 72px}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-family:'Sora',sans-serif;font-size:36px;font-weight:700;color:var(--navy);
    letter-spacing:-0.01em}
  .sub{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;
    padding-top:14px;border-top:2px solid var(--navy)}
  .sub .lede{color:var(--ink-2);max-width:58ch}
  button{font-family:'Inter';font-size:13px;font-weight:600;border:0;border-radius:10px;
    padding:11px 20px;cursor:pointer;background:var(--navy);color:#fff}
  button:hover{background:#0d2c4b}
  button[disabled]{opacity:.55;cursor:default}
  .stamp{margin-left:auto;font-size:11.5px;color:var(--ink-3);background:#E8F2FA;
    padding:6px 12px;border-radius:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:26px 0}
  .cell{border-radius:16px;padding:20px;color:#fff;background:var(--fill)}
  .cell .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(255,255,255,.85);font-weight:600}
  .cell .v{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin-top:10px}
  .cell .c{font-size:11px;color:rgba(255,255,255,.78);margin-top:8px}
  .log{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;
    font-family:ui-monospace,monospace;font-size:12px;color:var(--ink-2);white-space:pre-wrap;
    max-height:320px;overflow:auto}
  .err{color:var(--orange-deep);font-weight:600}
  h2{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--navy);margin:32px 0 12px}
  .foot{font-size:10.5px;color:var(--ink-3);margin-top:30px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>ZogoTech Sales Intel</h1>
  <div class="sub">
    <div class="lede">Pipedrive, IPEDS and the RFPSchoolWatch feed, pulled on demand. The reports read this snapshot rather than talking to Pipedrive themselves.</div>
    <span class="stamp" id="stamp">checking…</span>
  </div>
  <div style="margin-top:18px"><button id="go">Refresh data</button></div>

  <div class="grid" id="cells"></div>

  <h2>Last run</h2>
  <div class="log" id="log">No run yet in this session.</div>

  <div class="foot" id="attr"></div>
</div>
<script>
const el = (id) => document.getElementById(id);
const fmt = (t) => t ? new Date(t).toLocaleString() : 'never';

function cells(s){
  const c = s.counts || {};
  const set = [
    ['Open deals', c.open ?? '—', '#1D5488'],
    ['Won', c.won ?? '—', '#2E7D6B'],
    ['Lost', c.lost ?? '—', '#5B93C4'],
    ['RFP bids', c.bids ?? '—', '#F2872E'],
  ];
  el('cells').innerHTML = set.map(([k,v,f]) =>
    `<div class="cell" style="--fill:linear-gradient(155deg,${f}dd,${f})">
       <div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

async function status(){
  const s = await (await fetch('/api/status')).json();
  el('stamp').textContent = s.pulledAt ? 'Last refreshed ' + fmt(s.pulledAt) : 'Never refreshed';
  cells(s);
  if (s.errors?.length) el('log').innerHTML =
    s.errors.map(e => `<span class="err">${e}</span>`).join('\n');
}

el('go').addEventListener('click', async () => {
  const b = el('go');
  b.disabled = true; b.textContent = 'Refreshing…';
  el('log').textContent = 'Pulling Pipedrive, IPEDS and the RFP feed. This takes a minute.';
  try {
    const res = await fetch('/api/refresh', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({}),
    });
    const out = await res.json();
    el('log').textContent = JSON.stringify(out, null, 2);
  } catch (e) {
    el('log').innerHTML = `<span class="err">${e.message}</span>`;
  }
  b.disabled = false; b.textContent = 'Refresh data';
  status();
});

el('attr').textContent =
  'Integrated Postsecondary Education Data System, Education Data Portal, Urban Institute, ' +
  'made available under the ODC Attribution License.';
status();
</script>
</body>
</html>
